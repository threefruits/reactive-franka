[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactive-franka"
version = "0.1.0"
description = "PyBullet Franka pick/place with cuRobo v2 RGB-D mapping and YOLO + ICP"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12", "pybullet==3.2.7", "trimesh>=4.6", "pillow>=10"]

[project.optional-dependencies]
gpu = ["nvidia-curobo[cu12]", "torch==2.7.1"]
vision = ["ultralytics>=8.3,<9", "torch==2.7.1", "torchvision==0.22.1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[project.scripts]
reactive-franka = "reactive_franka.main:main"

[tool.uv.sources]
nvidia-curobo = { git = "https://github.com/NVlabs/curobo.git", rev = "78fd485fa82d9b9a063fb4985e371814587e666a" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires cuRobo and a CUDA GPU"]

[tool.ruff]
line-length = 100
